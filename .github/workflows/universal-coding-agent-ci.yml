name: Universal Coding Agent CI

on:
  push:
    branches:
      - feature/universal-coding-agent-mvp
    paths:
      - "universal-coding-agent/**"
      - ".github/workflows/universal-coding-agent-ci.yml"
  pull_request:
    paths:
      - "universal-coding-agent/**"
      - ".github/workflows/universal-coding-agent-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    defaults:
      run:
        working-directory: universal-coding-agent

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: repository

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: repository/universal-coding-agent/pyproject.toml

      - name: Install package and development dependencies
        working-directory: repository/universal-coding-agent
        run: python -m pip install -e '.[dev]'

      - name: Compile Python sources
        working-directory: repository/universal-coding-agent
        run: python -m compileall -q src tests

      - name: Run lint
        working-directory: repository/universal-coding-agent
        run: ruff check --output-format=github .

      - name: Run tests
        working-directory: repository/universal-coding-agent
        run: pytest -q
