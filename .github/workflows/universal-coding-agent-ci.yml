name: Universal Coding Agent CI

on:
  push:
    branches:
      - feature/universal-coding-agent-mvp
    paths:
      - "universal-coding-agent/**"
      - ".github/workflows/universal-coding-agent-ci.yml"
  pull_request:
    paths:
      - "universal-coding-agent/**"
      - ".github/workflows/universal-coding-agent-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: repository

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: repository/universal-coding-agent/pyproject.toml

      - name: Install package and development dependencies
        working-directory: repository/universal-coding-agent
        run: python -m pip install -e '.[dev]'

      - name: Compile Python sources
        working-directory: repository/universal-coding-agent
        run: python -m compileall -q src tests

      - name: Diagnose Ruff import ordering
        working-directory: repository/universal-coding-agent
        shell: bash
        run: |
          set -euo pipefail
          target='src/universal_coding_agent/providers/external.py'
          ruff check --fix "$target" || true
          if ! git diff --quiet -- "$target"; then
            encoded="$(git diff -- "$target" | base64 -w0)"
            echo "::error file=$target::RUFF_FIX_BASE64=$encoded"
            exit 1
          fi

      - name: Run lint
        working-directory: repository/universal-coding-agent
        run: ruff check --output-format=github .

      - name: Run tests
        working-directory: repository/universal-coding-agent
        run: pytest -q
