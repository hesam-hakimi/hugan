[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "universal-coding-agent"
version = "0.1.0"
description = "Provider-neutral LangGraph orchestration for sandboxed multi-repository coding tasks"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Universal Coding Agent contributors"}]
dependencies = [
  "langgraph>=1.2.0,<2.0.0",
  "langgraph-checkpoint-sqlite>=3.1.1,<4.0.0",
  "pydantic>=2.10,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
uca = "universal_coding_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/universal_coding_agent"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/universal_coding_agent/testlab/hard_reasoning.py" = ["E501"]
"src/universal_coding_agent/testlab/large_solution.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["universal_coding_agent"]
